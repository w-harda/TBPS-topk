[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbps-topk-attributes"
version = "0.1.0"
description = "TBPS 第一阶段：属性提取、匹配、评分与 Dynamic Top-K"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "nltk>=3.8,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

